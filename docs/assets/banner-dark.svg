<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="tikray — First-class xray-core proxy routing on MikroTik RouterOS v7">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="55%" stop-color="#0d0d12"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="16%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEmerald" cx="84%" cy="56%" r="44%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#27272a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27272a" stroke-width="0.65" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Card frame -->
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#glowIndigo)"/>
  <rect x="1" y="1" width="1198" height="318" rx="18" fill="url(#glowEmerald)"/>

  <!-- Right-side live topology card -->
  <g transform="translate(760, 48)">
    <rect x="0" y="0" width="390" height="224" rx="14" fill="#111114" fill-opacity="0.94" stroke="#27272a" stroke-width="1.2"/>
    <circle cx="18" cy="18" r="4.2" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="32" cy="18" r="4.2" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="46" cy="18" r="4.2" fill="#22c55e" fill-opacity="0.85"/>
    <text x="64" y="22" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#71717a">tikray-topology · 172.31.255.0/29</text>
    <line x1="0" y1="34" x2="390" y2="34" stroke="#1f1f25" stroke-width="1"/>

    <!-- Routing paths -->
    <path d="M 92 86 C 118 86, 122 86, 148 86" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 232 84 C 258 84, 262 64, 290 64" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M 232 92 C 258 92, 262 146, 290 146" fill="none" stroke="url(#accent)" stroke-width="2.4"/>

    <!-- Node: Wi-Fi / LAN -->
    <rect x="16" y="58" width="76" height="56" rx="9" fill="#17171c" stroke="#2d2d36" stroke-width="1.2"/>
    <text x="54" y="80" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#f4f4f5">Wi-Fi / LAN</text>
    <text x="54" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#a1a1aa">Ports · VLAN</text>

    <!-- Node: RouterOS -->
    <rect x="148" y="58" width="84" height="56" rx="9" fill="#17171c" stroke="#6366f1" stroke-width="1.4"/>
    <text x="190" y="80" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#f4f4f5">RouterOS</text>
    <text x="190" y="96" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9.5" fill="#818cf8">v7.25.1 · WAN</text>

    <!-- Node: Direct ISP -->
    <rect x="290" y="44" width="84" height="42" rx="8" fill="#0c1c14" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="332" y="62" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#4ade80">DIRECT</text>
    <text x="332" y="76" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#22c55e">FastTrack</text>

    <!-- Node: xray-core -->
    <rect x="290" y="120" width="84" height="52" rx="9" fill="#141428" stroke="#818cf8" stroke-width="1.4"/>
    <text x="332" y="142" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#eef2ff">xray-core</text>
    <text x="332" y="158" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#a5b4fc">REALITY · PQ</text>

    <!-- Status footer strip -->
    <rect x="16" y="152" width="256" height="54" rx="9" fill="#0c0c0f" stroke="#1f1f25" stroke-width="1"/>
    <circle cx="32" cy="171" r="4" fill="#22c55e"/>
    <text x="44" y="175" font-family="ui-monospace, monospace" font-size="10.5" fill="#e4e4e7">tikray + tikray-runner · 68 ms HTTP</text>
    <text x="28" y="193" font-family="ui-monospace, monospace" font-size="9.5" fill="#71717a">RAM: 48M + 24M + 128M · Auto-Rollback</text>
  </g>

  <!-- Hexagon Brand Mark (matching live Obsidian UI) -->
  <g transform="translate(56, 62)">
    <rect x="0" y="0" width="66" height="66" rx="16" fill="#17171c" stroke="#2d2d36" stroke-width="1.6"/>
    <path d="M 33 13 L 50 23 V 43 L 33 53 L 16 43 V 23 Z" fill="none" stroke="#818cf8" stroke-width="3.6" stroke-linejoin="round"/>
    <circle cx="33" cy="33" r="6.2" fill="#22c55e"/>
  </g>

  <!-- Title & Version Pill -->
  <text x="142" y="109" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.6" fill="#f4f4f5">tikray</text>
  <rect x="308" y="75" width="64" height="24" rx="12" fill="#18182e" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1"/>
  <text x="340" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" fill="#a5b4fc">v1.0.0</text>

  <text x="58" y="168" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22.5" font-weight="600" fill="#e4e4e7">First-class <tspan fill="#818cf8">xray-core</tspan> proxy routing on <tspan fill="#4ade80">MikroTik RouterOS v7</tspan></text>
  <text x="58" y="199" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a1a1aa">Wi-Fi &amp; LAN port steering · Multi-WAN pinning · Embedded 86 KB Web UI · Zero-downtime reloads</text>

  <!-- Bottom Feature Pills -->
  <g transform="translate(58, 232)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.2" font-weight="600">
    <rect x="0" y="0" width="174" height="32" rx="8" fill="#141418" stroke="#2d2d36" stroke-width="1"/>
    <circle cx="15" cy="16" r="3.5" fill="#818cf8"/>
    <text x="27" y="20" fill="#e4e4e7">RouterOS 7.23 – 7.26+</text>

    <rect x="184" y="0" width="138" height="32" rx="8" fill="#141418" stroke="#2d2d36" stroke-width="1"/>
    <circle cx="199" cy="16" r="3.5" fill="#6366f1"/>
    <text x="211" y="20" fill="#c7d2fe">xray-core 26.x</text>

    <rect x="332" y="0" width="176" height="32" rx="8" fill="#141418" stroke="#2d2d36" stroke-width="1"/>
    <circle cx="347" cy="16" r="3.5" fill="#22c55e"/>
    <text x="359" y="20" fill="#bbf7d0">Wi-Fi · Ports · WAN</text>

    <rect x="518" y="0" width="160" height="32" rx="8" fill="#141418" stroke="#2d2d36" stroke-width="1"/>
    <circle cx="533" cy="16" r="3.5" fill="#a78bfa"/>
    <text x="545" y="20" fill="#e9d5ff">Config &amp; JSON UI</text>
  </g>
</svg>
