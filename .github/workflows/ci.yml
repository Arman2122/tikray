name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    name: Web UI check & bundle sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, type-check and build Web UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - name: Verify embedded internal/ui/dist is up to date
        run: |
          if ! git diff --quiet -- internal/ui/dist || [[ -n "$(git ls-files --others --exclude-standard internal/ui/dist)" ]]; then
            echo "::error::internal/ui/dist is out of sync with web/; run 'make ui' and commit the updated bundle."
            git status -s internal/ui/dist
            exit 1
          fi

  test:
    name: Go vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - run: go vet -tags lab ./test/... ./internal/... ./spike/...

  race:
    name: Go race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make race

  # Every golden config must pass xray run -test on the oldest supported and
  # the newest two xray-core releases (spec §8.2). The test builds them into
  # ~/.cache/tikray-lab/xray, and needs root: releases before 26.10 open the
  # config's TUN device during the test.
  compat:
    name: xray-core compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: ~/.cache/tikray-lab/xray
          key: xray-${{ hashFiles('test/lab/xray.go') }}
      - name: Test the golden configs on xray-core releases
        env:
          TIKRAY_COMPAT_REQUIRED: "1"
        run: sudo --preserve-env=PATH,HOME,GOPATH,GOMODCACHE,GOCACHE,TIKRAY_COMPAT_REQUIRED go test -tags compat -count=1 -timeout 60m ./test/compat/...

  # RouterOS cannot import archives that Docker's containerd image store
  # writes, so the job switches Docker to the classic store first.
  images:
    name: RouterOS container images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Use Docker's classic image store
        run: |
          echo '{"features":{"containerd-snapshotter":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Build the images
        run: |
          scripts/build-images.sh amd64
          scripts/build-images.sh arm64
      - name: Check the archives
        run: |
          for image in tikray-runner tikray; do
            for arch in amd64 arm64; do
              tar -xOf "out/$image-$arch.tar" manifest.json | grep -q '"Layers"'
            done
          done
